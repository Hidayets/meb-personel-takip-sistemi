<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Ana gradient - Koyu mavi tonları (MEB kurumsal renkleri) -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    
    <!-- İkincil gradient - Altın/Sarı (Devlet kurumsal) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb300;stop-opacity:1" />
    </linearGradient>
    
    <!-- Açık mavi gradient -->
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gölge efekti -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Arka plan - Yuvarlak köşeli kare -->
  <rect x="8" y="8" width="240" height="240" rx="32" ry="32" fill="url(#mainGrad)" filter="url(#shadow)"/>
  
  <!-- Dekoratif dış çerçeve -->
  <rect x="16" y="16" width="224" height="224" rx="28" ry="28" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Okul binası silüeti -->
  <g transform="translate(128, 85)">
    <!-- Ana bina gövdesi -->
    <rect x="-55" y="0" width="110" height="70" rx="4" fill="white" opacity="0.95"/>
    
    <!-- Çatı -->
    <polygon points="-60,-5 0,-30 60,-5" fill="url(#goldGrad)"/>
    
    <!-- Bayrak direği ve bayrak -->
    <line x1="0" y1="-30" x2="0" y2="-55" stroke="#c0c0c0" stroke-width="3"/>
    <path d="M 0,-55 L 20,-50 L 0,-42 Z" fill="#e53935"/>
    
    <!-- Pencereler - üst sıra -->
    <rect x="-42" y="10" width="18" height="16" rx="2" fill="url(#lightBlueGrad)" opacity="0.8"/>
    <rect x="-9" y="10" width="18" height="16" rx="2" fill="url(#lightBlueGrad)" opacity="0.8"/>
    <rect x="24" y="10" width="18" height="16" rx="2" fill="url(#lightBlueGrad)" opacity="0.8"/>
    
    <!-- Ana kapı -->
    <rect x="-12" y="38" width="24" height="32" rx="12" ry="4" fill="url(#goldGrad)"/>
    <circle cx="7" cy="55" r="2" fill="#1e3a5f"/>
    
    <!-- Yan pencereler - alt sıra -->
    <rect x="-42" y="42" width="18" height="16" rx="2" fill="url(#lightBlueGrad)" opacity="0.8"/>
    <rect x="24" y="42" width="18" height="16" rx="2" fill="url(#lightBlueGrad)" opacity="0.8"/>
  </g>
  
  <!-- Personel ikonları - 3 kişi -->
  <g transform="translate(128, 180)">
    <!-- Sol kişi -->
    <circle cx="-40" cy="0" r="12" fill="white" opacity="0.9"/>
    <path d="M -55,25 Q -55,12 -40,12 Q -25,12 -25,25 L -25,28 L -55,28 Z" fill="white" opacity="0.9"/>
    
    <!-- Orta kişi (öne çıkmış) -->
    <circle cx="0" cy="-5" r="14" fill="url(#goldGrad)"/>
    <path d="M -18,22 Q -18,8 0,8 Q 18,8 18,22 L 18,28 L -18,28 Z" fill="url(#goldGrad)"/>
    
    <!-- Sağ kişi -->
    <circle cx="40" cy="0" r="12" fill="white" opacity="0.9"/>
    <path d="M 25,25 Q 25,12 40,12 Q 55,12 55,25 L 55,28 L 25,28 Z" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Alt kısım - "MEB" yazısı stilize -->
  <g transform="translate(128, 230)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" opacity="0.9">PERSONEL TAKİP</text>
  </g>
  
  <!-- Köşe dekorasyonları -->
  <circle cx="32" cy="32" r="4" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="224" cy="32" r="4" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="32" cy="224" r="4" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="224" cy="224" r="4" fill="url(#goldGrad)" opacity="0.7"/>
</svg>
